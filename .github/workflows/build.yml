
name: CyberGuard Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Compile C to WebAssembly
        run: |
          emcc main.c security.c \
            -o cyberguard.wasm \
            -s STANDALONE_WASM=1

      - name: Upload WebAssembly
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-WASM
          path: cyberguard.wasm
