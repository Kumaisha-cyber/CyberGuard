
name: CyberGuard Complete Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile C Project
        run: |
          gcc -Wall -Wextra -std=c11 \
          main.c security.c analyzer.c report.c \
          -o cyberguard

      - name: Run CyberGuard
        run: ./cyberguard

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WebAssembly
        run: |
          mkdir -p build
          emcc main.c security.c analyzer.c report.c \
          -o build/cyberguard.js \
          -s EXIT_RUNTIME=1

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-Build
          path: build/
